# 系列文章，文章的 front matter 中写 series: <id> 即可在正文开头显示目录，Series 页面按这里的顺序列出所有系列
# posts 中写文章地址中的名字（/posts/<名字>/），顺序即阅读顺序；还没有写的文章不会显示

deep-learning:
  name: 深度学习
  intro: 用 PyTorch 从搭建模型、训练、调试到部署的一组笔记。按下面的顺序阅读，后面的文章会直接引用前面讲过的内容
  groups:
    - name: 模型结构
      posts: [pytorch-cnn, pytorch-transformer, vision-transformer]
    - name: 训练
      posts:
        - pytorch-data-loading
        - pytorch-training
        - optimizers-and-lr-schedules
        - pytorch-checkpoints-and-reproducibility
        - normalization-and-regularization
        - pytorch-debugging
        - pytorch-common-mistakes
        - pytorch-memory-and-speed
        - evaluation-metrics
        - tensorboard
        - experiment-tracking
        - pytorch-distributed-training
    - name: 任务
      posts: [pytorch-fine-tuning, object-detection, object-detection-inference, image-segmentation, keypoint-detection, generative-models]
    - name: 部署
      posts: [pytorch-deployment, model-compression]

computer-vision:
  name: 计算机视觉
  intro: 传统图像处理的常用操作，以及相机成像和坐标变换的基础
  groups:
    - name: 图像处理
      posts: [image-filtering, edge-detection]
    - name: 相机与几何
      posts: [homogeneous-transformation-matrix, field-of-view]

cpp:
  name: C++
  intro: C++ 标准库和语言特性的用法整理，以及进程间通信
  groups:
    - name: 语言与标准库
      posts: [cpp-containers, cpp-lambda-expressions, cpp-multithreading, cpp-async-tasks, formatted-output]
    - name: 通信
      posts: [zeromq-messaging]

linux:
  name: Linux
  intro: Ubuntu 的系统配置、常用命令行工具、文件系统挂载和 Docker
  groups:
    - name: 系统
      posts: [ubuntu-optimization, linux-tools, linux-mounting]
    - name: 容器
      posts: [docker-configuration]
